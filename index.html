<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13151d">
<title>トナメ事前連絡メーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#13151d; --panel:#1b1f2c; --line:#2c3247; --fg:#ece6d8; --muted:#8e93a6; --gold:#c9a45c; --gold-ink:#1d1708;
  color-scheme:dark;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center}
canvas#cv{width:100%;max-width:300px;aspect-ratio:9/16;height:auto;border-radius:6px;background:#0c0e14}
.guide{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in{width:100%;font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch}
.stepper button{font:inherit;font-size:28px;font-weight:700;border:1px solid var(--line);background:#10131b;color:var(--fg);border-radius:10px;cursor:pointer;min-height:56px}
.stepper output{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;background:#10131b;border:1px solid var(--line);border-radius:10px}
.stepper output small{font-size:15px;margin-left:6px;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold)}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--fg);margin:0;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:700;padding:14px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--fg);cursor:pointer}
.btn.main{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn:focus-visible,.stepper button:focus-visible,.in:focus-visible,.chk input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn,.stepper button,.tab{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .2s,color .2s,border-color .2s}
.btn{box-shadow:0 4px 0 #05060a}
.btn.main{box-shadow:0 4px 0 #8a6d33}
.stepper button{box-shadow:0 3px 0 #05060a}
.tab{box-shadow:0 3px 0 #05060a}
.btn:active,.stepper button:active,.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #05060a}
.btn.main:active{box-shadow:0 1px 0 #8a6d33}
.btn.done{background:#e8dcc0;color:var(--gold-ink);border-color:#e8dcc0}
@media (prefers-reduced-motion:reduce){.btn,.stepper button,.tab{transition:none}}
.msg{font-size:13px;color:var(--muted);min-height:1.4em;white-space:pre-wrap}
.file{display:flex;flex-direction:column;gap:6px}
.file input{font:inherit;font-size:13px;color:var(--muted)}
.saved{display:none;flex-direction:column;gap:8px;align-items:center}
.saved.on{display:flex}
.saved img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{font:inherit;font-size:15px;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--muted);cursor:pointer}
.tab.on{color:var(--fg);border-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>トナメ事前連絡メーカー</h1>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabS" role="tab" aria-selected="true">ストーリー 9:16</button>
    <button class="tab" id="tabX" role="tab" aria-selected="false">X 4:5</button>
  </div>
  <div class="preview"><canvas id="cv" width="1080" height="1920"></canvas></div>
  <div class="guide" id="guide">ストーリー用（1080×1920）のプレビューです</div>

  <div class="card">
    <div>
      <label for="name">イベント名</label>
      <input class="in" id="name" type="text" value="THURSDAY TOURNAMENT" autocomplete="off">
    </div>
    <div class="two">
      <div><label for="start">START</label><input class="in" id="start" type="time" value="19:30"></div>
      <div><label for="regend">REG-END</label><input class="in" id="regend" type="time" value="20:30"></div>
    </div>
    <div>
      <label for="entry">ENTRY費（円）</label>
      <input class="in" id="entry" type="number" inputmode="numeric" min="0" step="100" value="3000">
    </div>
    <div>
      <label class="chk" for="addon"><input id="addon" type="checkbox"> ADD-ONあり</label>
    </div>
    <div id="addonBox" hidden>
      <label for="addonFee">ADD-ON費（円）</label>
      <input class="in" id="addonFee" type="number" inputmode="numeric" min="0" step="100" value="1000">
    </div>
    <div>
      <label>現在のご予約人数</label>
      <div class="stepper">
        <button id="minus" aria-label="1人減らす">−</button>
        <output id="count">3<small>名様</small></output>
        <button id="plus" aria-label="1人増やす">＋</button>
      </div>
    </div>
    <div>
      <label for="ypos">文字の上下位置（表示中のサイズ用）</label>
      <input id="ypos" type="range" min="500" max="1500" value="960">
      <button class="btn" id="yreset" style="margin-top:10px;padding:10px;font-size:14px">位置を初期に戻す</button>
    </div>
  </div>

  <div class="card">
    <div class="file">
      <label for="bg">背景画像（そのイベントの告知画像など）</label>
      <input id="bg" type="file" accept="image/*">
    </div>
    <div>
      <label for="blur">ぼかし（強いほど元の文字が読めなくなります）</label>
      <input id="blur" type="range" min="0" max="100" value="70">
    </div>
    <div>
      <label for="dark">暗さ</label>
      <input id="dark" type="range" min="0" max="85" value="50">
    </div>
    <div class="note">背景は1枚で、ストーリー用にもX用にも中央を切り出して使います。一度選べば端末に記憶されます。保存ボタンを押すと共有画面が開くので、「画像を保存」を選ぶと写真に入ります。</div>
  </div>

  <div class="btns">
    <button class="btn main" id="saveStory">ストーリー用を保存（1080×1920）</button>
    <button class="btn main" id="saveX">X用を保存（4:5・1080×1350）</button>
    <button class="btn" id="copy">投稿文をコピー</button>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="saved" id="saved">
    <div class="msg">保存画面が出ないときは、下の画像を長押しして保存してください。</div>
    <img id="savedImg" alt="書き出した画像">
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var $=function(id){return document.getElementById(id)};
  var mode='s', count=3, bgImg=null, ypos={s:960,x:675}, DEF={s:960,x:675};
  var RANGE={s:[400,1500],x:[300,1050]}, H={s:1920,x:1350};
  var FONT='"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  var GOLD='#d9bd82', IVORY='#f3ecdc';
  var FIELDS=['name','start','regend','entry','addonFee','blur','dark'];

  try{
    var st=JSON.parse(localStorage.getItem('tj_state')||'{}');
    FIELDS.forEach(function(k){ if(st[k]!==undefined) $(k).value=st[k]; });
    if(st.addon) $('addon').checked=true;
    if(typeof st.count==='number') count=st.count;
    if(typeof st.ys==='number') ypos.s=st.ys;
    if(typeof st.yx==='number') ypos.x=st.yx;
  }catch(e){}
  function clampY(){ ['s','x'].forEach(function(m){ var v=ypos[m]; if(isNaN(v)) v=DEF[m]; ypos[m]=Math.min(RANGE[m][1],Math.max(RANGE[m][0],v)); }); }
  clampY();
  try{ var d=localStorage.getItem('tj_bg'); if(d){ var im0=new Image(); im0.onload=function(){bgImg=im0;draw();}; im0.src=d; } }catch(e){}

  function setMsg(s){ $('msg').textContent=s; }
  function persist(){
    try{
      var o={addon:$('addon').checked,count:count,ys:ypos.s,yx:ypos.x};
      FIELDS.forEach(function(k){ o[k]=$(k).value; });
      localStorage.setItem('tj_state',JSON.stringify(o));
    }catch(e){}
  }
  function yen(v){ var n=parseInt(v,10); if(isNaN(n)) n=0; return '¥'+n.toLocaleString('en-US'); }
  function hm(v,def){ return v||def; }

  function flash(btn,text){
    if(!btn) return;
    if(btn._t){ clearTimeout(btn._t); } else { btn._label=btn.textContent; }
    btn.textContent='✓ '+text; btn.classList.add('done');
    btn._t=setTimeout(function(){ btn.textContent=btn._label; btn.classList.remove('done'); btn._t=null; },2000);
  }

  function ensureFonts(){
    if(!document.fonts||!document.fonts.load) return Promise.resolve();
    var s=($('name').value||'')+'参加ご予約いただいてます。名様お待ちしております0123456789:¥,';
    return Promise.all([
      document.fonts.load('500 40px "Zen Kaku Gothic New"',s),
      document.fonts.load('700 40px "Zen Kaku Gothic New"',s),
      document.fonts.load('900 40px "Zen Kaku Gothic New"',s),
      document.fonts.load('700 40px "Cinzel"',"START ENTRY REG-END ADD-ON Today's | TOURNAMENT")
    ]).catch(function(){});
  }

  /* ---- 背景: 縮小→段階的に拡大でぼかす（iPhoneのcanvasはfilter非対応のため） ---- */
  var blurCache={key:'',canvas:null};
  function coverCanvas(im,w,h){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var r=Math.max(w/im.width,h/im.height), iw=im.width*r, ih=im.height*r;
    c.getContext('2d').drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih);
    return c;
  }
  function blurred(m,amount){
    var h=H[m], key=m+'|'+amount+'|'+(bgImg?bgImg.src.length+'|'+bgImg.width:0);
    if(blurCache.key===key) return blurCache.canvas;
    var base=coverCanvas(bgImg,1080,h);
    if(amount>0){
      var k=1+amount*0.6;                       // 縮小率(最大 約61分の1)
      var w=Math.max(4,Math.round(1080/k)), hh=Math.max(4,Math.round(h/k));
      var cur=document.createElement('canvas'); cur.width=w; cur.height=hh;
      var cx=cur.getContext('2d'); cx.imageSmoothingQuality='high'; cx.drawImage(base,0,0,w,hh);
      while(cur.width<1080){
        var nw=Math.min(1080,cur.width*2), nh=Math.round(nw*h/1080);
        var n=document.createElement('canvas'); n.width=nw; n.height=nh;
        var nx=n.getContext('2d'); nx.imageSmoothingEnabled=true; nx.imageSmoothingQuality='high';
        nx.drawImage(cur,0,0,nw,nh); cur=n;
      }
      base=cur;
    }
    blurCache={key:key,canvas:base};
    return base;
  }

  function drawBase(c,m){
    var h=H[m];
    if(bgImg){
      c.drawImage(blurred(m,+$('blur').value),0,0,1080,h);
      c.fillStyle='rgba(0,0,0,'+(+$('dark').value/100)+')'; c.fillRect(0,0,1080,h);
    }else{
      var g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1a1d2b'); g.addColorStop(1,'#10121a');
      c.fillStyle=g; c.fillRect(0,0,1080,h);
      c.fillStyle='#8e93a6'; c.font='500 40px '+FONT; c.textAlign='center'; c.textBaseline='alphabetic';
      c.fillText('背景画像を選んでください',540,h*0.12);
    }
  }

  /* ---- 文字 ---- */
  function shadow(c,on){ c.shadowColor=on?'rgba(0,0,0,.5)':'transparent'; c.shadowBlur=on?14:0; c.shadowOffsetY=on?3:0; }
  function center(c,txt,y,size,weight,color,family){
    c.font=weight+' '+size+'px '+(family||FONT); c.fillStyle=color; c.textAlign='center'; c.textBaseline='alphabetic';
    shadow(c,true); c.fillText(txt,540,y); shadow(c,false);
  }
  function spaced(c,txt,y,size,color,sp){
    c.font='700 '+size+'px "Cinzel",serif'; c.fillStyle=color; c.textAlign='left'; c.textBaseline='alphabetic';
    var w=0,i,ws=[]; for(i=0;i<txt.length;i++){ws.push(c.measureText(txt[i]).width); w+=ws[i]+(i<txt.length-1?sp:0);}
    var x=540-w/2; shadow(c,true);
    for(i=0;i<txt.length;i++){c.fillText(txt[i],x,y); x+=ws[i]+sp;}
    shadow(c,false);
  }
  function pair(c,big,small,y,bigSize,smallSize){
    c.textBaseline='alphabetic';
    c.font='900 '+bigSize+'px '+FONT; var w1=c.measureText(big).width;
    c.font='700 '+smallSize+'px '+FONT; var w2=c.measureText(small).width;
    var gap=14, x=540-(w1+gap+w2)/2; c.textAlign='left'; shadow(c,true);
    c.font='900 '+bigSize+'px '+FONT; c.fillStyle=GOLD; c.fillText(big,x,y);
    c.font='700 '+smallSize+'px '+FONT; c.fillText(small,x+w1+gap,y);
    shadow(c,false);
  }
  function fitName(c,txt,max){
    var size=104; c.font='900 '+size+'px '+FONT;
    while(size>52 && c.measureText(txt).width>max){ size-=4; c.font='900 '+size+'px '+FONT; }
    return size;
  }

  function rows(){
    var r=[['START',hm($('start').value,'19:30')],['ENTRY',yen($('entry').value)],['REG-END',hm($('regend').value,'20:30')]];
    if($('addon').checked) r.push(['ADD-ON',yen($('addonFee').value)]);
    return r;
  }

  function drawText(c,m){
    var R=rows(), RH=118;
    var total=250+R.length*RH+60+(count>0?300:190);
    var top=ypos[m]-total/2;
    spaced(c,"Today's | TOURNAMENT",top+20,50,GOLD,10);
    c.fillStyle='rgba(217,189,130,.55)'; c.fillRect(440,top+54,200,2);
    var name=($('name').value||'').trim()||'TOURNAMENT';
    var fs=fitName(c,name,900);
    center(c,name,top+60+fs*0.95+30,fs,900,IVORY);
    var y0=top+250;
    c.fillStyle='rgba(217,189,130,.45)'; c.fillRect(120,y0-20,840,2);
    for(var i=0;i<R.length;i++){
      var by=y0+i*RH+RH*0.68;
      c.font='700 40px "Cinzel",serif'; c.fillStyle=GOLD; c.textAlign='left'; c.textBaseline='alphabetic';
      shadow(c,true); c.fillText(R[i][0].split('').join(' '),130,by-6);
      c.font='900 76px '+FONT; c.fillStyle=IVORY; c.textAlign='right'; c.fillText(R[i][1],950,by); shadow(c,false);
      c.fillStyle='rgba(217,189,130,.45)'; c.fillRect(120,y0+(i+1)*RH-20,840,2);
    }
    var cy=y0+R.length*RH+40;
    if(count>0){
      pair(c,String(count),'名様',cy+190,190,80);
      center(c,'参加ご予約いただいてます。',cy+280,48,500,IVORY);
    }else{
      center(c,'参加ご予約を',cy+90,56,500,IVORY);
      center(c,'お待ちしております。',cy+170,56,500,IVORY);
    }
  }

  var seq=0;
  function draw(){
    var my=++seq;
    ensureFonts().then(function(){
      if(my!==seq) return;
      if(cv.height!==H[mode]){ cv.height=H[mode]; }
      cv.style.aspectRatio='1080 / '+H[mode];
      ctx.clearRect(0,0,1080,H[mode]);
      drawBase(ctx,mode); drawText(ctx,mode);
      warm();
    });
  }

  /* ---- 書き出し ---- */
  var cache={s:null,x:null}, warmTimer=null, warmVer=0;
  function warm(){
    cache={s:null,x:null}; var v=++warmVer; clearTimeout(warmTimer);
    warmTimer=setTimeout(function(){
      ['s','x'].forEach(function(m){
        exportBlob(m).then(function(b){
          if(b&&v===warmVer){ try{ cache[m]=new File([b],'tournament-'+(m==='x'?'4x5':'story')+'.png',{type:'image/png'}); }catch(e){} }
        });
      });
    },500);
  }
  function canShareFile(f){
    try{ return !!(f&&navigator.canShare&&navigator.share&&window.matchMedia('(pointer:coarse)').matches&&navigator.canShare({files:[f]})); }catch(e){ return false; }
  }
  function exportBlob(m){
    return ensureFonts().then(function(){
      var c=document.createElement('canvas'); c.width=1080; c.height=H[m];
      var x=c.getContext('2d'); drawBase(x,m); drawText(x,m);
      return new Promise(function(res){ c.toBlob(res,'image/png'); });
    });
  }
  function showFallback(blob){ try{ $('savedImg').src=URL.createObjectURL(blob); $('saved').classList.add('on'); }catch(e){} }

  function save(m,btn){
    var f=cache[m];
    if(canShareFile(f)){
      showFallback(f);
      navigator.share({files:[f]}).then(function(){ flash(btn,'完了しました'); setMsg('「画像を保存」を選ぶと、写真に入ります。'); },function(e){
        if(e&&e.name==='AbortError'){ setMsg('キャンセルしました。'); } else { setMsg('開けませんでした。下の画像を長押しして保存してください。'); }
      });
      return;
    }
    setMsg('画像を作っています…');
    exportBlob(m).then(function(blob){
      if(!blob){ setMsg('画像を作れませんでした。もう一度お試しください。'); return; }
      showFallback(blob);
      var name='tournament-'+(m==='x'?'4x5':'story')+'.png';
      try{ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); flash(btn,'保存しました'); setMsg('保存しました。保存されないときは、下の画像を長押しして保存してください。'); }catch(e){ setMsg('下の画像を長押しして保存してください。'); }
    });
  }

  function postText(){
    var n=($('name').value||'').trim()||'TOURNAMENT';
    var s='【'+n+'】\nSTART：'+hm($('start').value,'19:30')+'\nENTRY：'+yen($('entry').value)+'\nREG-END：'+hm($('regend').value,'20:30');
    if($('addon').checked) s+='\nADD-ON：'+yen($('addonFee').value);
    s+='\n\n'+(count>0 ? count+'名様参加ご予約いただいてます！' : '参加ご予約をお待ちしております！');
    return s;
  }

  function refreshCount(){ $('count').innerHTML=count+'<small>名様</small>'; }
  function refreshAddon(){ $('addonBox').hidden=!$('addon').checked; }
  function setMode(m){
    mode=m;
    $('tabS').classList.toggle('on',m==='s'); $('tabX').classList.toggle('on',m==='x');
    $('tabS').setAttribute('aria-selected',m==='s'); $('tabX').setAttribute('aria-selected',m==='x');
    var r=$('ypos'); r.min=RANGE[m][0]; r.max=RANGE[m][1]; r.value=ypos[m];
    $('guide').textContent= m==='s' ? 'ストーリー用（1080×1920）のプレビューです' : 'X用（4:5・1080×1350）のプレビューです';
    draw();
  }

  $('tabS').onclick=function(){ setMode('s'); };
  $('tabX').onclick=function(){ setMode('x'); };
  $('plus').onclick=function(){ count=Math.min(99,count+1); refreshCount(); persist(); draw(); };
  $('minus').onclick=function(){ count=Math.max(0,count-1); refreshCount(); persist(); draw(); };
  FIELDS.forEach(function(k){ $(k).addEventListener('input',function(){ persist(); draw(); }); });
  $('addon').addEventListener('change',function(){ refreshAddon(); persist(); draw(); });
  $('ypos').addEventListener('input',function(){ ypos[mode]=+$('ypos').value; persist(); draw(); });
  $('yreset').onclick=function(){ ypos[mode]=DEF[mode]; $('ypos').value=DEF[mode]; persist(); draw(); };
  $('saveStory').onclick=function(){ save('s',this); };
  $('saveX').onclick=function(){ save('x',this); };
  $('copy').onclick=function(){
    var t=postText();
    var done=function(){ flash($('copy'),'コピーしました'); setMsg('投稿文をコピーしました。'); };
    var fail=function(){ setMsg('コピーできませんでした。\n'+t); };
    try{ navigator.clipboard.writeText(t).then(done,fail); }catch(e){ fail(); }
  };

  $('bg').addEventListener('change',function(ev){
    var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var c=document.createElement('canvas'); var r=Math.min(1,1080/im.width);
        c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        try{ localStorage.setItem('tj_bg',c.toDataURL('image/jpeg',0.9)); }catch(e){}
        bgImg=im; draw(); setMsg('背景画像を設定しました。');
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });

  refreshCount(); refreshAddon(); setMode('s');
})();
</script>
